<body>

  <!-- Navigation -->
  <div class="navbar">
    <a href="#" class="logo"><i class="fa fa-map-marker-alt"></i> TravelCo</a>
    <a href="#" class="search"><i class="fa fa-search"></i></a>
  </div>

  <!-- Hero -->
  <header class="hero">
    <img src="https://www.w3schools.com/w3images/london2.jpg" alt="Paris Vacation Deals and Hotels" 
     title="Paris Travel Packages" >
    <div class="hero-content">
      <div class="tabs">
        <button class="tablink" onclick="openLink(event, 'Flight')"><i class="fa fa-plane"></i> Flight</button>
        <button class="tablink" onclick="openLink(event, 'Hotel')"><i class="fa fa-bed"></i> Hotel</button>
        <button class="tablink" onclick="openLink(event, 'Car')"><i class="fa fa-car"></i> Rental</button>
      </div>

      <div id="Flight" class="tab-content">
        <h3>Travel the world with us</h3>
        <input type="text" placeholder="Departing from">
        <input type="text" placeholder="Arriving at">
        <button>Search Flights</button>
      </div>

      <div id="Hotel" class="tab-content">
        <h3>Find the best hotels</h3>
        <button>Search Hotels</button>
      </div>

      <div id="Car" class="tab-content">
        <h3>Best car rental worldwide!</h3>
        <input type="text" placeholder="Pick-up point">
        <button>Search Cars</button>
      </div>
    </div>
  </header>

  <!-- Footer -->
  <footer>
    <p>© 2026 TravelCo. All rights reserved.</p>
    <div class="social">
      <i class="fab fa-facebook"></i>
      <i class="fab fa-instagram"></i>
      <i class="fab fa-twitter"></i>
      <i class="fab fa-linkedin"></i>
    </div>
  </footer>

  <script src="index.js"></script>

</html>
